<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CasasCode – Nivel 4 · Layouts · 1 · Twins</title>

    <link rel="shortcut icon" type="image/png" href="../../logo.png" />
    <link rel="stylesheet" href="../../jasmine/jasmine-2.8.0/jasmine.css" />

    <script src="../../jasmine/jasmine-2.8.0/jasmine.js"></script>
    <script src="../../jasmine/jasmine-2.8.0/jasmine-html.js"></script>
    <script src="../../jasmine/jasmine-2.8.0/boot.js"></script>

    <link rel="stylesheet" href="styles.css" />
    <script src="../medidas.js"></script>
    <script src="tests/ejercicios.spec.js"></script>

    <style>
      /* ── Header con logo ── */
      body {
        margin: 0;
        font-family: Monaco, "Lucida Console", monospace;
        background: #f0f2f5;
      }

      #casascode-header {
        display: flex;
        align-items: center;
        gap: 14px;
        background: #0a1f3d;
        padding: 12px 20px;
        border-bottom: 4px solid #f0a500;
      }

      #casascode-header img {
        height: 72px;
      }

      #casascode-header .header-text h1 {
        margin: 0;
        color: #fff;
        font-size: 20px;
        font-family: Monaco, "Lucida Console", monospace;
        letter-spacing: 1px;
      }

      #casascode-header .header-text h1 span {
        color: #f0a500;
      }

      #casascode-header .header-text p {
        margin: 2px 0 0;
        color: #a8ccef;
        font-size: 12px;
      }

      /* ── Override colores morados de Jasmine → azul CasasCode ── */
      .jasmine_html-reporter {
        background-color: #f0f2f5;
        margin: 0;
        padding: 10px;
      }

      .jasmine_html-reporter .jasmine-banner .jasmine-title {
        display: none;
      }

      .jasmine_html-reporter .jasmine-run-options {
        border-color: #1a5fa8;
        color: #1a5fa8;
      }

      .jasmine_html-reporter .jasmine-run-options .jasmine-payload {
        border-color: #1a5fa8;
      }

      .jasmine-labname {
        background-color: #1a5fa8 !important;
        border-bottom: 2px solid #f0a500;
      }

      /* Passed → verde, Failed → rojo suave */
      .jasmine_html-reporter .jasmine-bar.jasmine-passed  { background-color: #007069; }
      .jasmine_html-reporter .jasmine-bar.jasmine-failed  { background-color: #a03030; }

      /* Símbolos: punto verde y X roja más visibles */
      .jasmine_html-reporter .jasmine-symbol-summary li.jasmine-passed:before { color: #27ae60; }
      .jasmine_html-reporter .jasmine-symbol-summary li.jasmine-failed:before { color: #a03030; }

      /* Descripción del test fallido */
      .jasmine_html-reporter .jasmine-failures .jasmine-spec-detail .jasmine-description { background-color: #a03030; }

      /* Ocultar stack trace y versión */
      .jasmine_html-reporter .jasmine-stack-trace { display: none; }
      .jasmine_html-reporter .jasmine-version { display: none; }

      /* Links de suite */
      .jasmine_html-reporter .jasmine-suite a { color: #1a5fa8; font-weight: bold; }
      .jasmine_html-reporter .jasmine-summary li.jasmine-passed a { color: #27ae60; }
      .jasmine_html-reporter .jasmine-summary li.jasmine-failed a  { color: #a03030; }

      .zona-de-trabajo {
        margin: 16px;
        padding: 16px;
        background: #ffffff;
        border: 1px solid #d0d7de;
        border-radius: 8px;
        font-family: Arial, sans-serif;
      }

      .zona-de-trabajo h2.etiqueta {
        margin: 0 0 12px;
        color: #0a1f3d;
        font-size: 14px;
        text-transform: uppercase;
      }

      .zona-de-trabajo .objetivo {
        display: block;
        max-width: 600px;
        width: 100%;
        border: 1px solid #d0d7de;
        border-radius: 6px;
      }

      #maqueta {
        width: 900px;
      }
    </style>
  </head>

  <body>
    <div id="casascode-header">
      <img src="../../logo.png" alt="CasasCode logo" />
      <div class="header-text">
        <h1><span>Casas</span>Code</h1>
        <p>Nivel 4 · Layouts · 1 · Twins</p>
      </div>
    </div>

    <section class="zona-de-trabajo">
      <h2 class="etiqueta">Objetivo</h2>
      <img class="objetivo" src="objetivo.png" alt="Layout que tienes que conseguir" />
    </section>

    <section class="zona-de-trabajo">
      <h2 class="etiqueta">Tu maqueta</h2>
      <div id="maqueta">
      <div class="contenedor">
        <header class="header">.header</header>
        <section class="centro">
          <div class="fila-principal">
            <main class="main-content">.main-content</main>
            <aside class="sidebar">.sidebar</aside>
          </div>
          <div class="fila-twins">
            <div class="twin">.twin</div>
            <div class="twin">.twin</div>
          </div>
        </section>
        <footer class="footer">.footer</footer>
      </div>
      </div>
    </section>
  </body>
</html>
